# ai-space app manifest. Contract: ai-space docs/app-spec.md (spec 1).

spec: 1
name: photo-play
title: PhotoPlay
description: Travel photo effects - upload a photo, pick an effect, compare the versions and download; every edit is a new version and the original is kept.
icon: icon.svg
url: /?lang={lang}
status: active
repo: https://github.com/ericz-lab/photo-play.git
i18n:
  zh:
    title: 旅行出片
    description: 上传一张旅行照片，选个玩法（清理背景、调光调色、明信片、手绘注释、自由描述），对比、继续改、下载；每次修改都是新版本，原图保留。
    widgets:
      recent: { title: 旅行出片 · 最近作品 }

# The app's own process. ai-space hands over PORT; the process binds 127.0.0.1 only.
service:
  command: bun src/index.ts
  port: 8975
  health: /healthz
  env:
    NODE_ENV: "production"

# Pictures come from POST /api/model/image, which only codex-cli serves; the tag is the template id.
model:
  default: codex/intermediate

widgets:
  - name: recent
    title: PhotoPlay · Recent
    kind: items
    source: /api/widget
    link: /
    size: 2x1
    refresh: 2m

storage:
  database: sqlite
  blobs: file

backup:
  include: [databases, files, blobs]

# `space app deploy` (the post-receive hook) runs these after checkout, after bun install
# --frozen-lockfile; a failure keeps the running service (ai-space docs/app-spec.md#deploy).
deploy:
  check: [bun run typecheck, bun test]
