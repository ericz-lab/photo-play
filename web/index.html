<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <title>旅行出片</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111112' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='4'/%3E%3Cpath d='m6 17 5-5 3 3 2-2 2 2'/%3E%3Ccircle cx='16' cy='8' r='1.3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script>try{var t=localStorage.getItem("photoplay-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" /><path d="m6 17 5-5 3 3 2-2 2 2" /><circle cx="16" cy="8" r="1.3" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 15v5h16v-5" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
        <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 4v16m0-13 4 4m-4 0 5 5m-5-1 3 3" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4zM13 7l4 4" /></symbol>
        <symbol id="i-compare" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM12 3v18" /></symbol>
        <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 8v5m0 3v.1" /></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 11v5m0-8v.1" /></symbol>
        <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
        <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 16 5-5 4 4 3-3 6 6" /><circle cx="16" cy="9" r="1.5" /></symbol>
      </defs>
    </svg>
    <header class="top">
      <div class="shell bar">
        <a class="brand" href="#/"><span class="mark"><svg class="icon"><use href="#i-logo" /></svg></span>旅行出片 <small lang="en">PhotoPlay</small></a>
        <button class="icon-btn theme" id="theme" type="button" aria-label="切换浅色或深色主题"><svg class="icon"><use href="#i-theme" /></svg></button>
      </div>
    </header>
    <div class="shell"><div id="notice" class="notice" hidden></div></div>
    <div class="app"><aside id="side" class="side" aria-label="作品"></aside><main id="view"></main></div>
    <input id="picker" type="file" accept="image/*" hidden />
    <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busy-text">正在处理…</p></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="lightbox" class="lightbox" hidden></div>
    <dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p class="muted" id="confirm-text"></p><div class="actions"><button class="danger" id="confirm-yes" type="button"></button><button type="button" id="confirm-no">取消</button></div></dialog>
    <script type="module" src="./app.ts"></script>
  <script>(function(){var s=document.createElement("script");s.src="/_space/usage.js";s.defer=true;document.head.appendChild(s)})()</script>
  <script>(function(){var s=document.createElement("script");s.src="/_space/feedback.js";s.defer=true;document.head.appendChild(s)})()</script>
</body>
</html>
