<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <title>PhotoPlay</title>
    <!-- Theme and language before the first paint (ai-space docs/app-spec.md#app-pages): the theme
         from ?theme, then the saved choice, else the system's; the language from ?lang, then the
         saved choice, then the browser. i18n.ts keeps them in step with the two buttons. -->
    <script>
      (function () {
        var d = document.documentElement, q = new URLSearchParams(location.search);
        var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
        var t = q.get("theme") || get("photo-play.theme");
        if (t === "light" || t === "dark") d.dataset.theme = t;
        var l = q.get("lang") || get("photo-play.lang") ||
          ((navigator.languages || [navigator.language]).find(function (x) { return /^(zh|en)/i.test(x); }) || "en");
        d.lang = /^zh/i.test(l) ? "zh-CN" : "en";
        var i = document.createElement("link"); i.rel = "icon"; i.type = "image/svg+xml"; i.href = "/icon.svg"; document.head.appendChild(i);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 15v5h16v-5" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4zM13 7l4 4" /></symbol>
        <symbol id="i-compare" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM12 3v18" /></symbol>
        <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 7v5l3 2" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 8v5m0 3v.1" /></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 11v5m0-8v.1" /></symbol>
        <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
        <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 16 5-5 4 4 3-3 6 6" /><circle cx="16" cy="9" r="1.5" /></symbol>
      </defs>
    </svg>
    <header class="top">
      <div class="shell bar">
        <a class="brand" href="#/"><span class="mark" id="logo"></span><span data-i18n="title"></span></a>
        <div class="prefs">
          <div class="seg" role="group" id="langs">
            <button type="button" data-lang="zh" lang="zh-CN">中</button>
            <button type="button" data-lang="en" lang="en">EN</button>
          </div>
          <button class="icon-btn theme" id="theme" type="button"></button>
        </div>
      </div>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="app"><aside id="side" class="side"></aside><main id="view"></main></div>
    <input id="picker" type="file" accept="image/*" hidden />
    <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busy-text"></p></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="lightbox" class="lightbox" hidden></div>
    <dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p class="muted" id="confirm-text"></p><div class="actions"><button class="danger" id="confirm-yes" type="button"></button><button type="button" id="confirm-no" data-i18n="cancel"></button></div></dialog>
    <script type="module" src="./app.ts"></script>
  <script>(function(){var s=document.createElement("script");s.src="/_space/usage.js";s.defer=true;document.head.appendChild(s)})()</script>
  <script>(function(){var s=document.createElement("script");s.src="/_space/feedback.js";s.defer=true;document.head.appendChild(s)})()</script>
</body>
</html>
